<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirCube Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .status.disconnected {
            background: rgba(244, 67, 54, 0.3);
        }

        /* Current Values Display */
        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .value-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .value-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .value-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .value-unit {
            font-size: 0.9em;
            color: #999;
            margin-left: 4px;
        }

        /* Charts */
        .charts-container {
            display: grid;
            gap: 20px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .chart-wrapper {
            position: relative;
            height: 250px;
        }

        /* AQI Color Coding */
        .aqi-good { color: #4CAF50; }
        .aqi-moderate { color: #FFC107; }
        .aqi-unhealthy-sensitive { color: #FF9800; }
        .aqi-unhealthy { color: #F44336; }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .values-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌬️ AirCube Dashboard</h1>
            <div class="status" id="connection-status">Connecting...</div>
        </header>

        <!-- Current Values -->
        <div class="values-grid">
            <div class="value-card">
                <div class="value-label">Temperature</div>
                <div class="value-number" id="temp-value">--.-<span class="value-unit">°F</span></div>
            </div>
            <div class="value-card">
                <div class="value-label">Humidity</div>
                <div class="value-number" id="humidity-value">--.-<span class="value-unit">%</span></div>
            </div>
            <div class="value-card">
                <div class="value-label">Air Quality Index</div>
                <div class="value-number" id="aqi-value">---<span class="value-unit">AQI</span></div>
            </div>
            <div class="value-card">
                <div class="value-label">eCO2</div>
                <div class="value-number" id="eco2-value">----<span class="value-unit">ppm</span></div>
            </div>
            <div class="value-card">
                <div class="value-label">eTVOC</div>
                <div class="value-number" id="etvoc-value">----<span class="value-unit">ppb</span></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">Temperature & Humidity</div>
                <div class="chart-wrapper">
                    <canvas id="tempHumidityChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-title">Air Quality Index (AQI)</div>
                <div class="chart-wrapper">
                    <canvas id="aqiChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-title">eCO2 & eTVOC Levels</div>
                <div class="chart-wrapper">
                    <canvas id="gasesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        const socket = io();

        // Connection status handling
        const statusEl = document.getElementById('connection-status');

        socket.on('connect', () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
            console.log('Connected to server');
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
            console.log('Disconnected from server');
        });

        // Data storage
        const maxPoints = 100000;
        const chartData = {
            time: [],
            temperature_f: [],
            humidity: [],
            aqi: [],
            eco2: [],
            etvoc: []
        };

        // Chart.js common options
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            // parsing: false, decimation is not actually working disable parsing breaks all graphs
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    position: 'top',
                },
                decimation: {
                    enabled: true,
                    algorithm: 'lttb',
                    samples: 60,
                },
            },
            scales: {
                x: {
                    type: 'linear',
                    title: {
                        display: true,
                        text: 'Time (seconds)'
                    },
                    ticks: {
                        maxTicksLimit: 10,
                        maxRotation: 0,
                        autoSkip: true,
                    }
                },
                y: {
                    beginAtZero: false
                }
            }
        };

        // Temperature & Humidity Chart
        const tempHumCtx = document.getElementById('tempHumidityChart').getContext('2d');
        const tempHumChart = new Chart(tempHumCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°F)',
                        data: [],
                        borderColor: 'rgb(239, 83, 80)',
                        tension: 0.1,
                        borderWidth: 2,
                        pointStyle: false
                    },
                    {
                        label: 'Humidity (%)',
                        data: [],
                        borderColor: 'rgb(33, 150, 243)',
                        tension: 0.1,
                        borderWidth: 2,
                        pointStyle: false
                    }
                ]
            },
            options: commonOptions
        });

        // AQI Chart
        const aqiCtx = document.getElementById('aqiChart').getContext('2d');
        const aqiChart = new Chart(aqiCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'AQI',
                        data: [],
                        borderColor: 'rgb(76, 175, 80)',
                        tension: 0.1,
                        borderWidth: 2,
                        fill: true,
                        pointStyle: false
                    }
                ]
            },
            options: {
                ...commonOptions,
                scales: {
                    ...commonOptions.scales,
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'AQI Value'
                        }
                    }
                }
            }
        });

        // Gases Chart (eCO2 & eTVOC)
        const gasesCtx = document.getElementById('gasesChart').getContext('2d');
        const gasesChart = new Chart(gasesCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'eCO2 (ppm)',
                        data: [],
                        borderColor: 'rgb(156, 39, 176)',
                        tension: 0.1,
                        borderWidth: 2,
                        pointStyle: false
                    },
                    {
                        label: 'eTVOC (ppb)',
                        data: [],
                        borderColor: 'rgb(0, 150, 136)',
                        tension: 0.1,
                        borderWidth: 2,
                        pointStyle: false
                    }
                ]
            },
            options: commonOptions
        });

        // Update current values display
        function updateValueDisplay(data) {
            const tempEl = document.getElementById('temp-value');
            const humEl = document.getElementById('humidity-value');
            const aqiEl = document.getElementById('aqi-value');
            const eco2El = document.getElementById('eco2-value');
            const etvocEl = document.getElementById('etvoc-value');

            if (data.temperature_f !== null && data.temperature_f !== undefined) {
                tempEl.innerHTML = `${data.temperature_f.toFixed(1)}<span class="value-unit">°F</span>`;
            }

            if (data.humidity !== null && data.humidity !== undefined) {
                humEl.innerHTML = `${data.humidity.toFixed(1)}<span class="value-unit">%</span>`;
            }

            if (data.aqi !== null && data.aqi !== undefined) {
                const aqiValue = Math.round(data.aqi);
                aqiEl.innerHTML = `${aqiValue}<span class="value-unit">AQI</span>`;

                // Color code AQI
                aqiEl.className = 'value-number';
                if (aqiValue <= 50) {
                    aqiEl.classList.add('aqi-good');
                } else if (aqiValue <= 100) {
                    aqiEl.classList.add('aqi-moderate');
                } else if (aqiValue <= 150) {
                    aqiEl.classList.add('aqi-unhealthy-sensitive');
                } else {
                    aqiEl.classList.add('aqi-unhealthy');
                }
            }

            if (data.eco2 !== null && data.eco2 !== undefined) {
                eco2El.innerHTML = `${Math.round(data.eco2)}<span class="value-unit">ppm</span>`;
            }

            if (data.etvoc !== null && data.etvoc !== undefined) {
                etvocEl.innerHTML = `${Math.round(data.etvoc)}<span class="value-unit">ppb</span>`;
            }
        }

        // Add data point to charts
        function addDataPoint(data) {
            // Add to data storage
            chartData.time.push(data.time);
            chartData.temperature_f.push(data.temperature_f);
            chartData.humidity.push(data.humidity);
            chartData.aqi.push(data.aqi);
            chartData.eco2.push(data.eco2);
            chartData.etvoc.push(data.etvoc);

            // Keep only last maxPoints
            if (chartData.time.length > maxPoints) {
                chartData.time.shift();
                chartData.temperature_f.shift();
                chartData.humidity.shift();
                chartData.aqi.shift();
                chartData.eco2.shift();
                chartData.etvoc.shift();
            }

            // Update charts
            updateCharts();
        }

        // Update all charts with current data
        function updateCharts() {
            // Temperature & Humidity
            tempHumChart.data.labels = chartData.time;
            tempHumChart.data.datasets[0].data = chartData.temperature_f;
            tempHumChart.data.datasets[1].data = chartData.humidity;
            tempHumChart.update();

            // AQI
            aqiChart.data.labels = chartData.time;
            aqiChart.data.datasets[0].data = chartData.aqi;
            aqiChart.update();

            // Gases
            gasesChart.data.labels = chartData.time;
            gasesChart.data.datasets[0].data = chartData.eco2;
            gasesChart.data.datasets[1].data = chartData.etvoc;
            gasesChart.update();
        }

        // Handle incoming sensor data
        socket.on('sensor_data', (data) => {
            console.log('Received data:', data);
            updateValueDisplay(data);
            addDataPoint(data);
        });

        // Handle historical data on connect
        socket.on('historical_data', (dataArray) => {
            console.log('Received historical data:', dataArray.length, 'points');

            // Clear existing data
            chartData.time = [];
            chartData.temperature_f = [];
            chartData.humidity = [];
            chartData.aqi = [];
            chartData.eco2 = [];
            chartData.etvoc = [];

            // Add all historical points
            dataArray.forEach(data => {
                chartData.time.push(data.time);
                chartData.temperature_f.push(data.temperature_f);
                chartData.humidity.push(data.humidity);
                chartData.aqi.push(data.aqi);
                chartData.eco2.push(data.eco2);
                chartData.etvoc.push(data.etvoc);
            });

            // Update displays with latest data
            if (dataArray.length > 0) {
                const latest = dataArray[dataArray.length - 1];
                updateValueDisplay(latest);
            }

            updateCharts();
        });
    </script>
</body>
</html>
